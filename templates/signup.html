<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Formulaire Moderne et Responsive</title>

    <meta name="author" content="Untree.co">
    <link rel="shortcut icon" href="favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="/static/css/style.css">
    
</head>
<body>

    <div class="site-wrap d-md-flex align-items-stretch">
        <div class="bg-img" style="background-image: url('/static/assets/images/img-bg-2.jpg')"></div>
        <div class="form-wrap">
            <div class="form-inner">
                <h1 class="title">Créer un compte</h1>
                <p class="caption mb-4">Créez votre compte en quelques secondes.</p>

                <!-- ✅ Error message container -->
                <div id="error-message" class="alert alert-danger d-none"></div>

                <form id="signup-form" class="pt-3">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="name" name="name" placeholder="Nom complet" required>
                        <label for="name">Nom complet</label>
                    </div>

                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" name="email" placeholder="exemple@domaine.com" required>
                        <label for="email">Adresse e-mail</label>
                    </div>

                    <div class="form-floating">
                        <span class="password-show-toggle js-password-show-toggle"><span class="uil"></span></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Mot de passe" required>
                        <label for="password">Mot de passe</label>
                    </div>

                    <div class="d-flex justify-content-between">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label for="terms" class="form-check-label">
                                J'accepte les <a href="#">Conditions d'utilisation</a> et la 
                                <a href="#">Politique de confidentialité</a>
                            </label>
                        </div>
                    </div>
                    <div class="d-flex justify-content-center mb-3">
                        <div id="loading-spinner" class="spinner-border text-primary" role="status" style="display: none;">
                            <span class="visually-hidden">Chargement...</span>
                        </div>
                    </div>
                    
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary">Créer un compte</button>
                    </div>

                    <div class="mb-2">Déjà membre ? <a href="/">Connectez-vous</a></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap & jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="/static/js/custom.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script>
        document.getElementById("signup-form").addEventListener("submit", async function(event) {
            event.preventDefault();  // Empêcher le rechargement de la page
        
            let formData = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };
        
            let spinner = document.getElementById("loading-spinner");
            let errorMessage = document.getElementById("error-message");
            let submitButton = document.querySelector("#signup-form button[type='submit']");
        
            // Afficher le spinner et désactiver le bouton
            spinner.style.display = "block";
            submitButton.disabled = true;
            errorMessage.classList.add("d-none");  // Cacher le message d'erreur précédent
        
            try {
                let response = await fetch("/inscription", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)
                });
        
                let result = await response.json();
        
                if (response.ok) {
                    window.location.href = "/simulation";  // ✅ Redirection en cas de succès
                } else {
                    errorMessage.textContent = result.detail || "Erreur d'inscription.";
                    errorMessage.classList.remove("d-none");
                }
            } catch (error) {
                console.error("Erreur :", error);
                errorMessage.textContent = "Une erreur est survenue. Veuillez réessayer.";
                errorMessage.classList.remove("d-none");
            } finally {
                // Masquer le spinner et réactiver le bouton
                spinner.style.display = "none";
                submitButton.disabled = false;
            }
        });
                
    </script>

</body>
</html>
