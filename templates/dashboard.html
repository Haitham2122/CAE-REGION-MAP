<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord</title>

    <link rel="shortcut icon" href="/static/assets/favicon.png">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="uil uil-chart-pie"></i> Mon Dashboard</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="#"><i class="uil uil-home"></i> Accueil</a></li>
                <li><a href="#"><i class="uil uil-users-alt"></i> Utilisateurs</a></li>
                <li><a href="#"><i class="uil uil-chart-line"></i> Statistiques</a></li>
                <li><a href="#"><i class="uil uil-setting"></i> Paramètres</a></li>
                <li><a href="#"><i class="uil uil-signout"></i> Déconnexion</a></li>
            </ul>
        </nav>

        <!-- Contenu principal -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <button type="button" id="sidebarCollapse" class="btn btn-info">
                    <i class="uil uil-bars"></i>
                </button>
            </nav>

            <div class="container-fluid">
                <h2 class="mt-3">👋 Bienvenue sur le Tableau de Bord</h2>
                <p class="text-muted">Voici un aperçu de votre activité.</p>

                <div class="row">
                    <div class="col-md-4">
                        <div class="card text-white bg-primary mb-3 animate">
                            <div class="card-body">
                                <h5 class="card-title"><i class="uil uil-user-circle"></i> Utilisateurs</h5>
                                <p class="card-text">📊 150 inscrits</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success mb-3 animate">
                            <div class="card-body">
                                <h5 class="card-title"><i class="uil uil-dollar-sign"></i> Revenus</h5>
                                <p class="card-text">💰 12,000€ ce mois-ci</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-warning mb-3 animate">
                            <div class="card-body">
                                <h5 class="card-title"><i class="uil uil-shopping-cart"></i> Commandes</h5>
                                <p class="card-text">📦 30 nouvelles commandes</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="/static/js/dashboard.js"></script>

</body>
</html>
