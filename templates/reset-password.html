<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du Mot de Passe</title>

    <meta name="author" content="Untree.co">
    <link rel="shortcut icon" href="favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="site-wrap d-md-flex align-items-stretch">
        <div class="bg-img" style="background-image: url('/static/assets/images/img-bg-2.jpg')"></div>
        <div class="form-wrap">
            <div class="form-inner">
                <h1 class="title">🔒 Réinitialisation du Mot de Passe</h1>
                <p class="caption mb-4">Entrez votre nouveau mot de passe.</p>

                <!-- ✅ Error message container -->
                <div id="error-message" class="alert alert-danger d-none"></div>
                <div id="success-message" class="alert alert-success d-none"></div>

                <form id="reset-password-form" class="pt-3">
                    <input type="hidden" id="reset-token">  <!-- Token from URL -->

                    <div class="form-floating">
                        <input type="password" class="form-control" id="new-password" placeholder="Nouveau mot de passe" required>
                        <label for="new-password">Nouveau mot de passe</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" class="form-control" id="confirm-password" placeholder="Confirmez le mot de passe" required>
                        <label for="confirm-password">Confirmez le mot de passe</label>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary">Réinitialiser</button>
                    </div>
                </form>

                <div class="mb-2">Se souvenir du mot de passe ? <a href="/">Connectez-vous</a></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

    <script>
        // Extract token from URL
        function getQueryParam(param) {
            let params = new URLSearchParams(window.location.search);
            return params.get(param);
        }

        document.getElementById("reset-token").value = getQueryParam("token");

        document.getElementById("reset-password-form").addEventListener("submit", async function(event) {
            event.preventDefault();  // Prevent page reload

            let token = document.getElementById("reset-token").value;
            let newPassword = document.getElementById("new-password").value;
            let confirmPassword = document.getElementById("confirm-password").value;

            if (newPassword !== confirmPassword) {
                let errorMessage = document.getElementById("error-message");
                errorMessage.textContent = "Les mots de passe ne correspondent pas.";
                errorMessage.classList.remove("d-none");
                return;
            }

            let formData = {
                token: token,
                new_password: newPassword
            };

            try {
                let response = await fetch("/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(formData)  
                });

                let result = await response.json();

                if (response.ok) {
                    let successMessage = document.getElementById("success-message");
                    successMessage.textContent = "Mot de passe réinitialisé avec succès.";
                    successMessage.classList.remove("d-none");
                    
                    setTimeout(() => {
                        window.location.href = "/";  // Redirect to login page
                    }, 2000);
                } else {
                    let errorMessage = document.getElementById("error-message");
                    errorMessage.textContent = result.detail || "Erreur de réinitialisation.";
                    errorMessage.classList.remove("d-none");
                }
            } catch (error) {
                console.error("Erreur :", error);
            }
        });
    </script>

</body>
</html>
