<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion / Inscription - Moderne et Responsive</title>

    <meta name="author" content="Untree.co">
    <link rel="shortcut icon" href="/static/assets/favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="site-wrap d-md-flex align-items-stretch">
        <div class="bg-img" style="background-image: url('/static/assets/images/img-bg-1.jpg')"></div>
        <div class="form-wrap">
            <div class="form-inner">
                <h1 class="title">Connexion</h1>
                <p class="caption mb-4">Veuillez entrer vos identifiants pour vous connecter.</p>
                <form id="login-form">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" placeholder="exemple@domaine.com" required>
                        <label for="email">Adresse e-mail</label>
                    </div>
                
                    <div class="form-floating">
                        <span class="password-show-toggle js-password-show-toggle"><span class="uil"></span></span>
                        <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
                        <label for="password">Mot de passe</label>
                    </div>
                    <div class="d-flex justify-content-center">
                        <div id="loading-spinner" class="spinner-border text-primary" role="status" style="display: none;">
                            <span class="visually-hidden">Chargement...</span>
                        </div>
                    </div>
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary">Se connecter</button>
                    </div>
                
                    <p id="error-message" style="color: red; display: none;">Identifiants incorrects.</p>
                             

                
                    <div class="d-flex justify-content-between">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label for="remember" class="form-check-label">Se souvenir de moi</label>
                        </div>
                        <div><a href="reset">Mot de passe oublié ?</a></div>
                    </div>
                    

                
                    <div class="mb-2">Vous n'avez pas de compte ? <a href="signup">Inscrivez-vous</a></div>
                
                    <div class="social-account-wrap" style="display: none;">
                        <h4 class="mb-4"><span>ou continuez avec</span></h4>
                        <ul class="list-unstyled social-account d-flex justify-content-between">
                            <li><a href="#"><img src="/static/assets/images/icon-google.svg" alt="Google"></a></li>
                            <li><a href="#"><img src="/static/assets/images/icon-facebook.svg" alt="Facebook"></a></li>
                            <li><a href="#"><img src="/static/assets/images/icon-apple.svg" alt="Apple"></a></li>
                            <li><a href="#"><img src="/static/assets/images/icon-twitter.svg" alt="Twitter"></a></li>
                        </ul>
                    </div>
                
                    {% if error %}
                        <p style="color: red;">{{ error }}</p>
                    {% endif %}
                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="/static/js/custom.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script>
        document.querySelector("#login-form").addEventListener("submit", async (event) => {
            event.preventDefault();  // Empêcher l'envoi classique du formulaire
        
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;
            let spinner = document.getElementById("loading-spinner");
            let errorMessage = document.getElementById("error-message");
            let submitButton = document.querySelector("#login-form button[type='submit']");
        
            // Afficher le spinner et désactiver le bouton
            spinner.style.display = "block";
            submitButton.disabled = true;
            errorMessage.style.display = "none";  // Cacher l'erreur précédente
        
            try {
                let response = await fetch("/login", {
                    method: "POST",
                    body: JSON.stringify({ email: email, password: password }),
                    headers: { "Content-Type": "application/json" }
                });
        
                let data = await response.json();
                console.log("Login Response:", data);
        
                if (response.ok) {
                    localStorage.setItem("token", data.access_token);
                    window.location.href = "/simulation";
                } else {
                    errorMessage.style.display = "block";  // Afficher le message d'erreur
                }
            } catch (error) {
                console.error("Erreur de connexion :", error);
                errorMessage.textContent = "Erreur de connexion. Veuillez réessayer.";
                errorMessage.style.display = "block";
            } finally {
                // Masquer le spinner et réactiver le bouton
                spinner.style.display = "none";
                submitButton.disabled = false;
            }
        });
        
        
        
        
    </script>
    
    
</body>
</html>
