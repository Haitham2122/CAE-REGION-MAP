<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupération du mot de passe</title>

    <meta name="author" content="Untree.co">
    <link rel="shortcut icon" href="favicon.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="site-wrap d-md-flex align-items-stretch">
        <div class="bg-img" style="background-image: url('/static/assets/images/img-bg-2.jpg')"></div>
        <div class="form-wrap">
            <div class="form-inner">
                <h1 class="title">🔒 Récupération du mot de passe</h1>
                <p class="caption mb-4">Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>

                <!-- ✅ Message Container -->
                <div id="message-box" class="alert d-none"></div>

                <form id="password-recovery-form" class="pt-3">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" name="email" placeholder="exemple@domaine.com" required>
                        <label for="email">Adresse e-mail</label>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary">Envoyer le lien de réinitialisation</button>
                    </div>

                    <div class="mb-2">Retour à <a href="/">la connexion</a></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap & jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>

    <script>
        document.getElementById("password-recovery-form").addEventListener("submit", async function(event) {
            event.preventDefault();  // Prevent page reload
        
            let email = document.getElementById("email").value;
        
            try {
                let response = await fetch("/password-recovery", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })  // ✅ Ensure JSON format
                });

                let result = await response.json();
                let messageBox = document.getElementById("message-box");

                if (response.ok) {
                    messageBox.textContent = "📩 Un lien de réinitialisation a été envoyé à votre email.";
                    messageBox.classList.remove("d-none", "alert-danger");
                    messageBox.classList.add("alert-success");
                } else {
                    messageBox.textContent = result.detail || "❌ Email non trouvé.";
                    messageBox.classList.remove("d-none", "alert-success");
                    messageBox.classList.add("alert-danger");
                }
            } catch (error) {
                console.error("Erreur :", error);
            }
        });
    </script>

</body>
</html>
