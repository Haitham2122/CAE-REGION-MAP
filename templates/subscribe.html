<!DOCTYPE html>
<html lang="fr">
<head>

    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation de Prime</title>

    <!-- Google Maps API avec Places (Auto-complétion) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDeNKRFbjHJ_KPg8t0SxadCQlX5fn9vKgo&libraries=places&language=es"></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #map {
            height: 300px;
            width: 100%;
            margin-top: 10px;
        }
        #parametres-techniques {
            display: none; /* Masqué par défaut */
            transition: all 0.3s ease;
        }
    </style>

    <style>
        header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
        }
        #logoutBtn {
            transition: background 0.3s ease;
        }
        #logoutBtn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<header class="d-flex justify-content-between align-items-center p-3">
    <div>
        <strong>👤 Nom :</strong> {{ user_name }} |
        <strong>🔑 Licence :</strong> {{ user_licence }} |
        <strong>📅 Prochaine Renouvellement :</strong> {{ renewal_date }}
    </div>
    <button id="logoutBtn" class="btn btn-danger">Déconnexion</button>
</header>

<body>


    <div class="container mt-5">
        <div class="container text-center mt-5">
            <h1>🔹 Abonnez-vous pour Continuer 🔹</h1>
            <p>Votre période est terminée le {{ renewal_date }}. Pour continuer à utiliser notre service, choisissez un plan ci-dessous :</p>
    
            <div class="card mx-auto mt-3" style="max-width: 400px;">
                <div class="card-body">
                    <h3>💳 Plan Mensuel</h3>
                    <p><strong>100 USD / mois</strong></p>
                    <button id="subscribe-button" class="btn btn-primary">S'abonner</button>
                </div>
            </div>
        </div>
    
        <script>
            document.getElementById("subscribe-button").addEventListener("click", async function () {
                let email = "{{ user.email | safe }}"; // Ensure email is correctly retrieved
        
                try {
                    let response = await fetch(`/create-checkout-session?email=${encodeURIComponent(email)}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                    });
        
                    let result = await response.json();
        
                    if (response.ok) {
                        window.location.href = result.url;  // Redirect to Stripe checkout
                    } else {
                        alert("Erreur : " + result.detail);
                    }
                } catch (error) {
                    console.error("Erreur :", error);
                }
            });

            document.getElementById("logoutBtn").addEventListener("click", async () => {
                await fetch("/logout", {
                    method: "POST",
                    credentials: "include"
                });
            
                window.location.href = "/";
            });
        </script>
    
    </div>

 
</body>
</html>
